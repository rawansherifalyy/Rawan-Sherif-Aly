<!DOCTYPE html>
<html>
<head>
    <title>Nova</title>
    <script src="https://cdn.tailwindcss.com"></script>  
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"> 
</head>
<body>
    <div class="bg-[url('hero-bg.svg')] bg-cover bg-center min-h-screen"> <!--screen so its adjusted to every screen-->
        <header class="flex justify-between  px-4 pt-6">
            <img src="logo.svg" alt="logo" class="w-30 h-15 px-6 ml-6"> 
            <nav class="md:flex gap-4 text-gray-600 font-semibold">
                <a href="" class="px-6 py-2 border border-blue-500 rounded-full text-blue-500">Home</a>
                <a href="" class="px-6 py-2 rounded-full hover:border hover:border-blue-500 hover:text-blue-500 transition">Feature</a>
                <a href="" class="px-6 py-2 rounded-full hover:border hover:border-blue-500 hover:text-blue-500 transition">About</a>
                <a href="" class="px-6 py-2 rounded-full hover:border hover:border-blue-500 hover:text-blue-500 transition ">Pricing</a>
                <a href="" class="px-6 py-2 rounded-full hover:border hover:border-blue-500 hover:text-blue-500 transition">Contact</a>

                        <i class="fa-solid fa-cart-shopping mt-4 mr-4"></i>
                        <i class="fa-regular fa-bell mt-4 px-4"></i>
                        <i class="fa-solid fa-bars mt-4 px-4"></i>
            </nav>
        </header>
        <section class="flex flex-col lg:flex-row justify-between "> 
            <div>
                <div class="mt-[150px]">
                    <h1 class="font-sans text-[#323450] text-left text-[50px] font-bold ml-14">
                    You're Using Free
                    </h1>
                </div>
                <h1 class=" font-sans text-[#323450] text-left text-[50px] font-bold ml-14">
                    Lite Version
                </h1>
                <p class="text-[#585978] text-left text-[18px] mt-6 ml-14 w-[500px]">
                    Please purchase full version of the template to get all sections and permission to use with commercial projects.
                </p>
                <button class="text-left font-semibold bg-blue-500 text-white px-[40px] py-[18px] rounded-full mt-6 text-[18px] ml-14">
                    Get Started&nbsp;&nbsp;<i class="fa-solid fa-chevron-right ml-4 text-[16px]"></i>
                </button>
            </div>
            <div class="mr-20 mt-10">
                <img src="hero-img.svg" alt="Hero Image" class="max-w-[550px]">
            </div>
        </section>
    </div>
</body>
</html>
