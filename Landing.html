<!DOCTYPE html>
<html>

<head>
    <title>Nova</title>
    <script src="https://cdn.tailwindcss.com"></script>  
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"> 
</head>



<body>
    <div class="bg-[url('hero-bg.svg')] bg-cover bg-center min-h-screen"> 
        <header class="flex justify-between items-center px-6 md:px-12 lg:px-20 py-6">
            <img src="logo.svg" alt="logo" class="w-32 h-auto"> 
            <button id="menu-btn" class="lg:hidden">
                <i class="fa-solid fa-bars"></i>
            </button>
        <nav class="hidden lg:flex items-center gap-6 text-gray-600 font-semibold"> 
                <a href="#" class="px-6 py-2 border border-blue-500 rounded-full text-blue-500">Home</a>
                <a href="#" class="px-6 py-2 rounded-full hover:border hover:border-blue-500 hover:text-blue-500 transition">Feature</a>
                <a href="#" class="px-6 py-2 rounded-full hover:border hover:border-blue-500 hover:text-blue-500 transition">About</a>
                <a href="#" class="px-6 py-2 rounded-full hover:border hover:border-blue-500 hover:text-blue-500 transition ">Pricing</a>
                <a href="#" class="px-6 py-2 rounded-full hover:border hover:border-blue-500 hover:text-blue-500 transition">Contact</a>
               
                <div class="flex items-center gap-4">
                    <i class="fa-solid fa-cart-shopping"></i> 
                    <i class="fa-regular fa-bell"></i> 
                </div>

        </nav>

        <nav id="mobile-menu" class="hidden flex-col gap-4 bg-white shadow-md rounded-lg p-4 absolute w-full top-20 left-6 right-6 lg:hidden">
                <a href="#" class="text-blue-500 font-semibold">Home</a>
                <a href="#" class="block">Feature</a>
                <a href="#" class="block">About</a>
                <a href="#" class="block">Pricing</a>
                <a href="#" class="block">Contact</a>
            <div class="flex gap-4">
                <i class="fa-solid fa-cart-shopping"></i>
                <i class="fa-regular fa-bell"></i>
            </div>

        </nav>

        </header>
        <section class="flex flex-col lg:flex-row justify-between px-6 md:px-12 lg:px-20"> 
            <div>
                <div class="mt-10 md:mt-24 lg:mt-36">
            <h1 class="font-sans text-[#323450] text-left text-4xl md:text-5xl font-bold">
                You're Using Free <br>
                Lite Version
            </h1>
                </div>
                <p class="text-[#585978] text-left text-[18px] mt-6 w-full max-w-lg">
                    Please purchase full version of the template to get all sections and permission to use with commercial projects.
                </p>
                <button class="text-left font-semibold bg-blue-500 hover:bg-blue-600 transition text-white px-[40px] py-[18px] rounded-full mt-6 text-[18px]">
                    Get Started&nbsp;&nbsp;<i class="fa-solid fa-chevron-right text-[16px]"></i>
                </button>
            </div>
            <div class="mt-10 lg:mt-0">
                <img src="hero-img.svg" alt="Hero Image" class="w-full max-w-sm md:max-w-lg mx-auto">
            </div>
        </section>
    </div>

<script>

const menuBtn = document.getElementById("menu-btn");
const mobileMenu = document.getElementById("mobile-menu");

menuBtn.addEventListener("click", function () {
mobileMenu.classList.toggle("hidden");
});

</script>

</body>
</html>
